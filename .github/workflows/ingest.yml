name: AIRA Ingestion

on:
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: "Proses ulang semua dokumen, termasuk yang sudah completed"
        type: boolean
        required: false
        default: false

      maks_dokumen:
        description: "Batas jumlah dokumen (kosongkan untuk semua)"
        type: string
        required: false
        default: ""

  schedule:
    # Setiap hari pukul 02.00 WIB (19.00 UTC)
    - cron: "0 19 * * *"

concurrency:
  group: aira-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: pipeline

    steps:
      # 1. Mengambil source code repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # 3. Memvalidasi GitHub Secrets
      - name: Validate Supabase environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY belum tersedia di GitHub Secrets."
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL belum tersedia di GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY belum tersedia di GitHub Secrets."
            exit 1
          fi

          echo "Supabase environment variables tersedia."

      # 4. Instalasi Tesseract OCR
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            tesseract-ocr \
            tesseract-ocr-ind \
            tesseract-ocr-eng

      # 5. Instalasi seluruh dependency Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 6. Memvalidasi instalasi dependency
      - name: Verify Python dependencies
        run: |
          python -c "import gdown, pymupdf, pytesseract, PIL, supabase; from google import genai; print('Semua dependency berhasil diimpor.')"
          tesseract --version

      # 7. Menjalankan ingestion
      - name: Run ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess || 'false' }}
          MAKS_DOKUMEN: ${{ github.event.inputs.maks_dokumen || '' }}

          EMBEDDING_MODEL_NAME: gemini-embedding-001
          EMBEDDING_DIMENSION: "768"

        run: |
          python ingest.py
